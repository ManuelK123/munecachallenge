<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Muñeca Mini-Games</title>
    <link rel="stylesheet" href="style.css">
    <style>
        #stage-select-screen {
            display: none;
            width: 100%;
            height: 100vh;
            background: radial-gradient(circle, #1a0933 0%, #05020a 100%);
            box-sizing: border-box;
            padding: 20px;
            text-align: center;
            color: #fff;
            font-family: 'Arial Black', sans-serif;
            position: relative;
        }

        .stage-title {
            font-size: 28px;
            letter-spacing: 3px;
            color: #ff3366;
            text-shadow: 0 0 10px #ff3366, 2px 2px 0px #000;
            margin-bottom: 20px;
        }

        .stage-grid {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
            max-width: 650px;
            margin: 0 auto;
        }

        .stage-card {
            width: 150px;
            background: rgba(20, 20, 35, 0.85);
            border: 3px solid #4a4a75;
            border-radius: 8px;
            padding: 8px;
            cursor: pointer;
            transition: all 0.2s ease-in-out;
            box-shadow: 0 4px 10px rgba(0,0,0,0.7);
        }

        .stage-card:hover, .stage-card:active {
            border-color: #00e5ff;
            transform: scale(1.05);
            box-shadow: 0 0 15px #00e5ff;
        }

        .stage-thumb {
            width: 100%;
            height: 110px;
            object-fit: cover;
            border-radius: 4px;
            background: #111;
        }

        .stage-name {
            font-size: 12px;
            margin-top: 8px;
            text-transform: uppercase;
            color: #e0e0e0;
            letter-spacing: 1px;
        }

        .btn-back {
            margin-top: 25px;
            padding: 10px 20px;
            background: #e74c3c;
            border: 2px solid #fff;
            color: white;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
        }

        #game-screen {
            display: none;
            position: relative;
            width: 100%;
            height: 100vh;
            background: #1a1a1a;
            overflow: hidden;
        }
        #gameCanvas {
            display: block;
            margin: 0 auto;
            max-width: 100%;
            max-height: 100vh;
        }
        #ui {
            position: absolute;
            top: 15px;
            left: 20px;
            color: #fff;
            font-size: 22px;
            font-weight: bold;
            text-shadow: 2px 2px 4px #000;
            z-index: 10;
        }
        #controls {
            position: absolute;
            bottom: 25px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 30px;
            box-sizing: border-box;
            z-index: 10;
        }
        .btn-control {
            width: 70px;
            height: 70px;
            background: rgba(46, 204, 113, 0.85);
            border: 3px solid #ffffff;
            border-radius: 50%;
            color: white;
            font-size: 26px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        .btn-jump {
            background: rgba(241, 196, 15, 0.9);
        }
        .btn-control:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <div id="game-container">
        <!-- MENÚ PRINCIPAL -->
        <div id="main-menu" class="screen">
            <h1 class="game-title">
                <span class="animate-word">MUÑECA</span><br>
                <span class="subtitle">MINI-GAMES</span>
            </h1>

            <div class="spacer"></div>

            <div class="blackboard-scene">
                <img src="boy_left.png.png" alt="Student" class="character boy-left">
                
                <div class="blackboard">
                    <img src="chalkboard_text.png.png" alt="Chalk Instructions" class="chalk-graphic">
                    <img src="muneca_prof.png.png" alt="Professor Muñeca" class="professor-muneca">
                </div>
                
                <img src="boy_right.png.png" alt="Student" class="character boy-right">
            </div>

            <div class="menu-buttons">
                <button class="btn btn-green" onclick="showStageSelect()">PLAY MINIGAMES</button>
                <button class="btn btn-yellow" onclick="startGame('story')">THE PLOT: MUÑECA'S STORY</button>
                <button class="btn btn-blue" onclick="abrirSeccionPago()">PAGO</button>
            </div>
            
            <div class="uane-footer">
                <img src="uane_logo.png.png" alt="UANE Logo" class="uane-logo">
            </div>
        </div>

        <!-- SELECCIONADOR DE ESCENARIOS -->
        <div id="stage-select-screen">
            <h2 class="stage-title">STAGE SELECT</h2>
            
            <div class="stage-grid">
                <div class="stage-card" onclick="cargarMinijuego('escalera')">
                    <img src="level_stairs.png" alt="Escaleras" class="stage-thumb">
                    <div class="stage-name">1. Escalera UANE</div>
                </div>

                <div class="stage-card" onclick="cargarMinijuego('kara')">
                    <img src="level_karts.png" alt="Karts" class="stage-thumb">
                    <div class="stage-name">2. Mini Kara Karts</div>
                </div>

                <div class="stage-card" onclick="cargarMinijuego('clases')">
                    <img src="dino_prof.png" alt="Clase" class="stage-thumb">
                    <div class="stage-name">3. Clase de Memoria</div>
                </div>

                <div class="stage-card" onclick="cargarMinijuego('cascada')">
                    <img src="cascada_fondo_1.png" alt="Cascada" class="stage-thumb" onerror="this.src='level_stairs.png'">
                    <div class="stage-name">5. Cascada de Barriles</div>
                </div>

                <div class="stage-card" onclick="cargarMinijuego('nivel6')">
                    <img src="cascada_fondo_1.png" alt="Nivel 6 Cascada" class="stage-thumb" onerror="this.src='level_stairs.png'">
                    <div class="stage-name">6. Cascada Abismo</div>
                </div>

                <!-- TARJETA NIVEL 7 ACTUALIZADA -->
                <div class="stage-card" onclick="cargarMinijuego('nivel7')">
                    <img src="pioa.jpg" alt="Mapa Zona Oeste" class="stage-thumb" onerror="this.src='level_stairs.png'">
                    <div class="stage-name">7. Mapa Zona Oeste</div>
                </div>
            </div>

            <button class="btn-back" onclick="volverAlMenu()">◀ REGRESAR</button>
        </div>

        <!-- PANTALLA DE JUEGO -->
        <div id="game-screen">
            <div id="ui">Puntaje: <span id="score">0</span></div>
            <canvas id="gameCanvas"></canvas>
            <div id="controls">
                <div class="btn-control" id="btn-left">◀</div>
                <div class="btn-control btn-jump" id="btn-jump">▲</div>
                <div class="btn-control" id="btn-right">▶</div>
            </div>
        </div>
    </div>

    <audio id="menu-music" src="menu_theme.mp3.mp3" autoplay muted loop></audio>

    <script src="game.js"></script>
</body>
</html>
