<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Muñeca Mini-Games</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Estilos ajustados para el contenedor de juego */
        #game-screen {
            display: none;
            position: relative;
            width: 100%;
            height: 100vh;
            background: #1a1a1a;
            overflow: hidden;
        }
        #gameCanvas {
            display: block;
            margin: 0 auto;
            max-width: 100%;
            max-height: 100vh;
        }
        #ui {
            position: absolute;
            top: 15px;
            left: 20px;
            color: #fff;
            font-size: 22px;
            font-weight: bold;
            text-shadow: 2px 2px 4px #000;
            z-index: 10;
        }
        #controls {
            position: absolute;
            bottom: 25px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 30px;
            box-sizing: border-box;
            z-index: 10;
        }
        .btn-control {
            width: 75px;
            height: 75px;
            background: rgba(46, 204, 113, 0.85);
            border: 3px solid #ffffff;
            border-radius: 50%;
            color: white;
            font-size: 30px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        .btn-control:active {
            background: rgba(39, 174, 96, 1);
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <div id="game-container">
        <!-- MENÚ PRINCIPAL -->
        <div id="main-menu" class="screen">
            <h1 class="game-title">
                <span class="animate-word">MUÑECA</span><br>
                <span class="subtitle">MINI-GAMES</span>
            </h1>

            <div class="spacer"></div>

            <div class="blackboard-scene">
                <img src="boy_left.png.png" alt="Student" class="character boy-left">
                
                <div class="blackboard">
                    <img src="chalkboard_text.png.png" alt="Chalk Instructions" class="chalk-graphic">
                    <img src="muneca_prof.png.png" alt="Professor Muñeca" class="professor-muneca">
                </div>
                
                <img src="boy_right.png.png" alt="Student" class="character boy-right">
            </div>

            <div class="menu-buttons">
                <button class="btn btn-green" onclick="startGame('play')">PLAY MINIGAMES</button>
                <button class="btn btn-yellow" onclick="startGame('story')">THE PLOT: MUÑECA'S STORY</button>
                <button class="btn btn-blue" onclick="openSettings()">SETTINGS</button>
            </div>
            
            <div class="uane-footer">
                <img src="uane_logo.png.png" alt="UANE Logo" class="uane-logo">
            </div>
        </div>

        <!-- PANTALLA DEL JUEGO (ESCALERA INFINITA) -->
        <div id="game-screen">
            <div id="ui">Puntaje: <span id="score">0</span></div>
            <canvas id="gameCanvas"></canvas>
            <div id="controls">
                <div class="btn-control" id="btn-left">◀</div>
                <div class="btn-control" id="btn-right">▶</div>
            </div>
        </div>
    </div>

    <audio id="menu-music" src="menu_theme.mp3.mp3" loop></audio>

    <script src="game.js"></script>
</body>
</html>
