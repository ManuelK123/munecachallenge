<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aventuras Caninas - Selector de Niveles</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a1a;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
        }

        header {
            margin: 20px 0;
            text-align: center;
        }

        h1 {
            font-size: 24px;
            color: #ffcc00;
            margin: 0;
        }

        /* Contenedor principal de la aplicación */
        #app-container {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Pantalla de Selección de Niveles */
        #level-select-screen {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px;
            box-sizing: border-box;
        }

        .stages-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
        }

        .stage-card {
            background-color: #2a2a2a;
            border: 2px solid #444;
            border-radius: 10px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s, border-color 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-bottom: 10px;
        }

        .stage-card:hover {
            transform: scale(1.03);
            border-color: #ffcc00;
        }

        .stage-thumb {
            width: 100%;
            height: 110px;
            object-fit: cover;
            background-color: #333;
        }

        .stage-name {
            margin-top: 8px;
            font-size: 14px;
            font-weight: bold;
            text-align: center;
            padding: 0 5px;
        }

        /* Contenedor del Minijuego (Canvas y HUD) */
        #game-screen {
            display: none;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        #ui {
            width: 400px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #111;
            padding: 8px 15px;
            box-sizing: border-box;
            border-top-left-radius: 8px;
            border-top-right-radius: 8px;
            font-weight: bold;
        }

        canvas {
            background-color: #000;
            display: block;
            border-left: 2px solid #333;
            border-right: 2px solid #333;
        }

        #controls {
            width: 400px;
            background: #111;
            padding: 12px;
            box-sizing: border-box;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom-left-radius: 8px;
            border-bottom-right-radius: 8px;
        }

        .btn-control {
            background: #333;
            color: white;
            border: 2px solid #555;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            cursor: pointer;
            font-weight: bold;
        }

        .btn-control:active {
            background: #555;
        }

        .btn-back {
            margin-top: 15px;
            background-color: #c0392b;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-back:hover {
            background-color: #e74c3c;
        }
    </style>
</head>
<body>

    <header>
        <h1>Aventuras Caninas</h1>
    </header>

    <div id="app-container">
        <!-- SELECTOR DE NIVELES -->
        <div id="level-select-screen">
            <h3 style="margin: 5px 0 15px 0; color: #aaa;">Selecciona un Nivel</h3>
            <div class="stages-grid">
                <div class="stage-card" onclick="cargarMinijuego('nivel1')">
                    <img src="level1.png" alt="Nivel 1" class="stage-thumb" onerror="this.src='https://via.placeholder.com/150?text=Nivel+1'">
                    <div class="stage-name">1. Parque Central</div>
                </div>
                <div class="stage-card" onclick="cargarMinijuego('nivel2')">
                    <img src="level2.png" alt="Nivel 2" class="stage-thumb" onerror="this.src='https://via.placeholder.com/150?text=Nivel+2'">
                    <div class="stage-name">2. Callejones</div>
                </div>
                <div class="stage-card" onclick="cargarMinijuego('nivel3')">
                    <img src="level3.png" alt="Nivel 3" class="stage-thumb" onerror="this.src='https://via.placeholder.com/150?text=Nivel+3'">
                    <div class="stage-name">3. Colina Verde</div>
                </div>
                <div class="stage-card" onclick="cargarMinijuego('nivel4')">
                    <img src="level4.png" alt="Nivel 4" class="stage-thumb" onerror="this.src='https://via.placeholder.com/150?text=Nivel+4'">
                    <div class="stage-name">4. Zona Industrial</div>
                </div>
                <div class="stage-card" onclick="cargarMinijuego('nivel5')">
                    <img src="level5.png" alt="Nivel 5" class="stage-thumb" onerror="this.src='https://via.placeholder.com/150?text=Nivel+5'">
                    <div class="stage-name">5. Bosque Oscuro</div>
                </div>
                <div class="stage-card" onclick="cargarMinijuego('nivel6')">
                    <img src="level6.png" alt="Nivel 6" class="stage-thumb" onerror="this.src='https://via.placeholder.com/150?text=Nivel+6'">
                    <div class="stage-name">6. Puente Colgante</div>
                </div>
                <!-- TARJETA NIVEL 7 ACTUALIZADA (MAPA ZONA OESTE) -->
                <div class="stage-card" onclick="cargarMinijuego('nivel7')">
                    <img src="pioa.jpg" alt="Mapa Zona Oeste" class="stage-thumb" onerror="this.src='level_stairs.png'">
                    <div class="stage-name">7. Mapa Zona Oeste</div>
                </div>
            </div>
        </div>

        <!-- PANTALLA DE JUEGO -->
        <div id="game-screen">
            <div id="ui"></div>
            <canvas id="gameCanvas"></canvas>
            <div id="controls"></div>
            <button class="btn-back" onclick="volverAlMenu()">Regresar al Menú</button>
        </div>
    </div>

    <!-- Enlace al archivo de lógica del juego -->
    <script src="game.js"></script>
</body>
</html>
