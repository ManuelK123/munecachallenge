<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aventuras Caninas - Selección de Niveles</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #12051d;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        #main-menu, #stage-select-screen {
            text-align: center;
            width: 100%;
            max-width: 480px;
            padding: 20px;
            box-sizing: border-box;
        }

        #stage-select-screen {
            display: none;
        }

        h1 {
            font-size: 26px;
            color: #f1c40f;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        .menu-btn {
            background-color: #e67e22;
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 18px;
            border-radius: 25px;
            cursor: pointer;
            margin: 10px 0;
            width: 80%;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            transition: 0.2s;
        }

        .menu-btn:hover {
            background-color: #d35400;
            transform: scale(1.05);
        }

        /* Estilos para el selector de escenarios tipo cuadrícula */
        .stages-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }

        .stage-card {
            background-color: #2c1b4d;
            border: 2px solid #8e44ad;
            border-radius: 12px;
            padding: 10px;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .stage-card:hover {
            border-color: #f1c40f;
            transform: translateY(-3px);
            background-color: #382463;
        }

        .stage-thumb {
            width: 100%;
            height: 90px;
            object-fit: cover;
            border-radius: 8px;
            background-color: #444;
        }

        .stage-name {
            margin-top: 8px;
            font-size: 14px;
            font-weight: bold;
            color: #ecf0f1;
        }

        /* Pantalla de juego */
        #game-screen {
            display: none;
            text-align: center;
            position: relative;
        }

        #ui {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 400px;
            margin: 0 auto 5px auto;
            padding: 0 5px;
            box-sizing: border-box;
        }

        canvas {
            border: 4px solid #f1c40f;
            border-radius: 10px;
            background-color: #000;
            box-shadow: 0 8px 16px rgba(0,0,0,0.6);
            display: block;
            margin: 0 auto;
        }

        #controls {
            display: flex;
            justify-content: space-between;
            width: 400px;
            margin: 15px auto 0 auto;
            box-sizing: border-box;
            padding: 0 10px;
        }

        .btn-control {
            background-color: #34495e;
            color: white;
            border: 2px solid #bdc3c7;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            font-size: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            user-select: none;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        .btn-control:active {
            background-color: #2c3e50;
            transform: scale(0.95);
        }

        .btn-jump {
            background-color: #e74c3c;
            border-color: #c0392b;
            border-radius: 15px;
            width: 75px;
        }
    </style>
</head>
<body>

    <!-- MENÚ PRINCIPAL -->
    <div id="main-menu">
        <h1>AVENTURAS CANINAS</h1>
        <button class="menu-btn" onclick="showStageSelect()">JUGAR</button>
        <button class="menu-btn" onclick="startGame('story')">MODO HISTORIA</button>
        <button class="menu-btn" onclick="abrirSeccionPago()">TIENDA / PAGOS</button>
    </div>

    <!-- SELECCIÓN DE NIVELES (MAPAS) -->
    <div id="stage-select-screen">
        <h1>SELECCIONA UN ESCENARIO</h1>
        <div class="stages-grid">
            <div class="stage-card" onclick="cargarMinijuego('escalera')">
                <img src="escenario_escalera.png" alt="Escalera" class="stage-thumb" onerror="this.src='escenario_escalera.png'">
                <div class="stage-name">1. Escalera Caracol</div>
            </div>
            <div class="stage-card" onclick="cargarMinijuego('kara')">
                <img src="boy_left.png.png" alt="Carretera Kara" class="stage-thumb" onerror="this.src='chalkboard_text.png.png'">
                <div class="stage-name">2. Carretera Kara</div>
            </div>
            <div class="stage-card" onclick="cargarMinijuego('clases')">
                <img src="escritoriio.png" alt="Clase" class="stage-thumb" onerror="this.src='dino_prof1.png'">
                <div class="stage-name">3. Clase de Memoria</div>
            </div>
            <div class="stage-card" onclick="cargarMinijuego('cascada')">
                <img src="cascada_fondo_1.png" alt="Cascada" class="stage-thumb" onerror="this.src='plataforma_larga.png'">
                <div class="stage-name">4. Cascada Original</div>
            </div>
            <div class="stage-card" onclick="cargarMinijuego('nivel6')">
                <img src="plataforma_larga.png" alt="Nivel 6" class="stage-thumb" onerror="this.src='barril_sprite.png'">
                <div class="stage-name">5. Cascada Cuadros</div>
            </div>
            <!-- TARJETA NIVEL 7 (MAPA ZONA OESTE) -->
            <div class="stage-card" onclick="cargarMinijuego('nivel7')">
                <img src="hd.jpg" alt="Mapa Zona Oeste" class="stage-thumb" onerror="this.src='level_stairs.png'">
                <div class="stage-name">7. Mapa Zona Oeste</div>
            </div>
        </div>
        <button class="menu-btn" onclick="volverAlMenu()" style="width: 50%; font-size: 15px; padding: 8px;">Volver</button>
    </div>

    <!-- PANTALLA DE JUEGO (LIENTZO Y CONTROLES TÁCTILES) -->
    <div id="game-screen">
        <div id="ui"></div>
        <canvas id="gameCanvas"></canvas>
        <div id="controls">
            <div class="btn-control" id="btn-left">◀</div>
            <div class="btn-control" id="btn-jump">▲</div>
            <div class="btn-control" id="btn-right">▶</div>
        </div>
    </div>

    <!-- AUDIO DE MENÚ OPCIONAL -->
    <audio id="menu-music" loop>
        <source src="menu_music.mp3" type="audio/mpeg">
    </audio>

    <!-- ENLAZAR EL SCRIPT EXTERNO -->
    <script src="game.js"></script>
</body>
</html>
