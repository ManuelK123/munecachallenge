<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aventuras UANE - Minijuegos</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #121212;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        #game-container {
            width: 400px;
            height: 700px;
            background: #1e1e1e;
            border: 4px solid #333;
            border-radius: 12px;
            position: relative;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow: hidden;
        }

        .screen {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
            position: absolute;
            top: 0;
            left: 0;
        }

        h1 {
            font-size: 26px;
            margin-bottom: 10px;
            color: #f1c40f;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.6);
        }

        p {
            font-size: 14px;
            color: #ccc;
            margin-bottom: 25px;
        }

        .btn {
            background: linear-gradient(135deg, #6c5ce7, #a29bfe);
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            margin: 8px 0;
            width: 80%;
            box-shadow: 0 4px 10px rgba(108, 92, 231, 0.4);
            transition: transform 0.1s ease, background 0.2s ease;
        }

        .btn:active {
            transform: scale(0.95);
        }

        .btn-secondary {
            background: linear-gradient(135deg, #d63031, #ff7675);
            box-shadow: 0 4px 10px rgba(214, 48, 49, 0.4);
        }

        /* Pantalla de juego */
        #game-screen {
            display: none;
            padding: 0;
        }

        canvas {
            background: #000;
            display: block;
        }

        #ui {
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
            background: rgba(0, 0, 0, 0.6);
            padding: 8px 12px;
            border-radius: 8px;
            z-index: 10;
        }

        #controls-overlay {
            position: absolute;
            bottom: 20px;
            width: 100%;
            display: flex;
            justify-content: space-around;
            padding: 0 20px;
            box-sizing: border-box;
            z-index: 10;
        }

        .ctrl-btn {
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid white;
            color: white;
            font-size: 20px;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            user-select: none;
            backdrop-filter: blur(4px);
        }

        .ctrl-btn:active {
            background: rgba(255, 255, 255, 0.5);
        }
    </style>
</head>
<body>

    <!-- Audio de Fondo del Menú (Interactúa para reproducir) -->
    <audio id="menu-music" loop muted>
        <source src="menu_music.mp3" type="audio/mpeg">
    </audio>

    <div id="game-container">
        
        <!-- Menú Principal -->
        <div id="main-menu" class="screen">
            <h1>AVENTURAS UANE</h1>
            <p>Selecciona una opción para comenzar</p>
            <button class="btn" onclick="showStageSelect()">Jugar Minijuegos</button>
            <button class="btn" onclick="startGame('story')">Modo Historia</button>
            <button class="btn" onclick="openSettings()">Opciones</button>
        </div>

        <!-- Pantalla de Selección de Niveles -->
        <div id="stage-select-screen" class="screen" style="display: none;">
            <h1>SELECCIONA NIVEL</h1>
            <p>Elige tu desafío:</p>
            <button class="btn" onclick="cargarMinijuego('escalera')">Nivel 1: Escalera Caracol</button>
            <button class="btn" onclick="cargarMinijuego('kara')">Nivel 2: Carretera Kara</button>
            <button class="btn" onclick="cargarMinijuego('clases')">Nivel 3: Clase de Memoria</button>
            <button class="btn btn-secondary" onclick="volverAlMenu()">Volver al Menú</button>
        </div>

        <!-- Pantalla Activa del Juego (Canvas) -->
        <div id="game-screen" class="screen">
            <div id="ui">
                <div>Puntaje: <span id="score">0</span></div>
            </div>
            
            <canvas id="gameCanvas"></canvas>

            <div id="controls-overlay">
                <div class="ctrl-btn" id="btn-left">◀</div>
                <div class="ctrl-btn" id="btn-jump">▲</div>
                <div class="ctrl-btn" id="btn-right">▶</div>
            </div>
        </div>

    </div>

    <!-- Archivo JavaScript principal -->
    <script src="game.js"></script>
</body>
</html>
