<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aventura de Juegos</title>
    <style>
        body {
            margin: 0;
            background-color: #1a1a1a;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        #game-container {
            text-align: center;
            border: 4px solid #333;
            border-radius: 8px;
            background-color: #000;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        #ui {
            background-color: #222;
            padding: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
            border-bottom: 2px solid #444;
        }
        canvas {
            display: block;
            background: #111;
        }
        #controls {
            display: flex;
            justify-content: space-around;
            background-color: #222;
            padding: 10px;
        }
        .control-btn {
            background-color: #444;
            color: white;
            border: none;
            padding: 15px 25px;
            font-size: 18px;
            border-radius: 5px;
            cursor: pointer;
        }
        .control-btn:active {
            background-color: #666;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="ui">
            <div>Nivel: <span id="level-display">7</span></div>
            <div id="hearts-container">❤❤❤❤❤</div>
        </div>
        <canvas id="gameCanvas" width="400" height="700"></canvas>
        <div id="controls">
            <button class="control-btn" id="btn-left">◀</button>
            <button class="control-btn" id="btn-jump">▲</button>
            <button class="control-btn" id="btn-right">▶</button>
        </div>
    </div>

    <!-- Archivo principal de lógica del juego -->
    <script src="game.js"></script>
</body>
</html>
